apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  clusterIP: None
  selector: {app: mongodb}
  ports:
    - {name: mongo, port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongodb
          image: mongo:7.0.16
          args: [--bind_ip_all, --wiredTigerCacheSizeGB, '0.25']
          envFrom:
            - secretRef: {name: mongo-secrets}
          env:
            - {name: MONGODB_DATABASE, value: hack_ai_v2}
            - {name: HOME, value: /tmp}
          ports:
            - {containerPort: 27017, name: mongo}
          startupProbe:
            tcpSocket: {port: mongo}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: configdb, mountPath: /data/configdb}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap: {name: mongo-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
