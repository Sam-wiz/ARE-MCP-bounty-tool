apiVersion: v1
kind: ServiceAccount
metadata:
  name: are-mcp
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: are-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: are-mcp}
  template:
    metadata:
      labels: {app: are-mcp}
    spec:
      serviceAccountName: are-mcp
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: are-mcp:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 2
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspaces, mountPath: /app/bounties}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspaces
          persistentVolumeClaim: {claimName: workspaces}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: are-mcp
spec:
  selector: {app: are-mcp}
  ports:
    - {name: http, port: 8080, targetPort: http}
