groups:
  - name: are-mcp
    rules:
      - alert: ApplicationUnavailable
        expr: up{job="are-mcp"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Application scrape is failing
          description: Check app pod logs, readiness and MongoDB/Redis health. Restore dependency before restarting the app.
      - alert: WorkflowErrorRate
        expr: sum(rate(are_rpc_requests_total{result=~"error|unavailable"}[5m])) / clamp_min(sum(rate(are_rpc_requests_total[5m])), 0.001) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: More than five percent of RPC requests fail
          description: Find failing request trace IDs in app logs and follow dependency spans in Jaeger.
      - alert: WorkflowLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(are_rpc_duration_seconds_bucket[5m]))) > 2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: RPC p95 latency exceeds two seconds
          description: Inspect dependency spans and CPU or memory pressure before changing resources.
