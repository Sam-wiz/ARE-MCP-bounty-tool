# Responder - LLMNR/NBT-NS poisoner
name: responder
category: network.mitm
version: "3.1.3"
description: LLMNR, NBT-NS and MDNS poisoner

install:
  method: apt
  command: apt-get install -y responder
  verify: responder -h

execute:
  command: responder -I {interface} -wrf
  input:
    interface:
      type: string
      required: true
  output:
    format: text
    type: credentials
  timeout: 3600

capabilities:
  - llmnr_poisoning
  - credential_capture
  - ntlm_relay

resources:
  cpu: low
  memory: low
  network: high
