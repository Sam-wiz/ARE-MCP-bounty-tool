# Knockpy
name: knockpy
category: recon.subdomains
version: "6.1.0"
description: Subdomain enumeration tool

install:
  method: pip
  command: pip3 install knock
  verify: knockpy -h

execute:
  command: knockpy {domain} -o {output_dir}
  input:
    domain:
      type: string
      required: true
    output_dir:
      type: string
      default: "/tmp/knockpy"
  output:
    format: json
    type: subdomains
  timeout: 1800

capabilities:
  - subdomain_enum
  - zone_transfer
  - wordlist_enum

resources:
  cpu: low
  memory: low
  network: high
