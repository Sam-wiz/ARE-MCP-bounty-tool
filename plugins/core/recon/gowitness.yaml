# Gowitness - Screenshot
name: gowitness
category: recon.screenshot
version: "2.5.1"
description: Web screenshot utility

install:
  method: go
  command: go install github.com/sensepost/gowitness@latest
  verify: gowitness -h

execute:
  command: gowitness file -f {input_file} -P {output_dir} --db-path {db_file}
  input:
    input_file:
      type: string
      required: true
    output_dir:
      type: string
      default: "/tmp/gowitness"
    db_file:
      type: string
      default: "/tmp/gowitness.sqlite3"
  output:
    format: sqlite
    type: screenshots
  timeout: 3600

capabilities:
  - web_screenshots
  - headless_chrome

resources:
  cpu: medium
  memory: high
  network: high
