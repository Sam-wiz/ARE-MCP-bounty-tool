# Asnmap - ASN mapping
name: asnmap
category: recon.osint
version: "1.0.6"
description: Quickly map organization to ASN

install:
  method: go
  command: go install github.com/projectdiscovery/asnmap/cmd/asnmap@latest
  verify: asnmap -version

execute:
  command: asnmap -d {domain} -json -o {output_file}
  input:
    domain:
      type: string
      required: true
    output_file:
      type: string
      default: "/tmp/asnmap.json"
  output:
    format: json
    type: asn_info
  timeout: 300

capabilities:
  - asn_lookup
  - org_mapping
  - cidr_discovery

resources:
  cpu: low
  memory: low
  network: low
