# TLSX - TLS grabber
name: tlsx
category: recon.tls
version: "1.1.5"
description: Fast and configurable TLS grabber

install:
  method: go
  command: go install github.com/projectdiscovery/tlsx/cmd/tlsx@latest
  verify: tlsx -version

execute:
  command: echo {host} | tlsx -json -o {output_file}
  input:
    host:
      type: string
      required: true
    output_file:
      type: string
      default: "/tmp/tlsx.json"
  output:
    format: json
    type: tls_info
  timeout: 300

capabilities:
  - tls_scanning
  - certificate_info
  - cipher_detection

resources:
  cpu: low
  memory: low
  network: moderate
