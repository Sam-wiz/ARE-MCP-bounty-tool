# GAU - GetAllUrls
name: gau
category: recon.urls
version: "2.1.0"
description: Fetch known URLs from AlienVault, Wayback, Common Crawl

install:
  method: go
  command: go install github.com/lc/gau/v2/cmd/gau@latest
  verify: gau -version

execute:
  command: gau {domain} --subs --o {output_file}
  input:
    domain:
      type: string
      required: true
    output_file:
      type: string
      default: "/tmp/gau_output.txt"
  output:
    format: lines
    type: urls
  timeout: 1800

capabilities:
  - url_discovery
  - wayback_machine
  - passive_recon

resources:
  cpu: low
  memory: low
  network: high
