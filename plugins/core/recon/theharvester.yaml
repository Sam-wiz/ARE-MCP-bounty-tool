# TheHarvester - OSINT
name: theharvester
category: recon.osint
version: "4.4.4"
description: E-mails, subdomains and names harvester

install:
  method: pip
  command: pip3 install theHarvester
  verify: theHarvester -h

execute:
  command: theHarvester -d {domain} -b all -f {output_file}
  input:
    domain:
      type: string
      required: true
    output_file:
      type: string
      default: "/tmp/theharvester"
  output:
    format: xml
    type: osint_data
  timeout: 1800

capabilities:
  - email_harvesting
  - subdomain_enum
  - social_media

resources:
  cpu: low
  memory: low
  network: high
