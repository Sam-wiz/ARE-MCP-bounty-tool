# Spiderfoot - OSINT automation
name: spiderfoot
category: recon.osint
version: "4.0.0"
description: Open source intelligence automation

install:
  method: pip
  command: pip3 install spiderfoot
  verify: sf -h

execute:
  command: sf -s {target} -o {output_dir} -q
  input:
    target:
      type: string
      required: true
    output_dir:
      type: string
      default: "/tmp/spiderfoot"
  output:
    format: directory
    type: osint_complete
  timeout: 7200

capabilities:
  - osint_automation
  - data_correlation
  - multi_source

resources:
  cpu: high
  memory: high
  network: very_high
