# Findomain
name: findomain
category: recon.subdomains
version: "9.0.0"
description: The fastest subdomain enumerator

install:
  method: binary
  command: curl -LO https://github.com/findomain/findomain/releases/latest/download/findomain-linux && chmod +x findomain-linux && mv findomain-linux /usr/local/bin/findomain
  verify: findomain -h

execute:
  command: findomain -t {domain} -u {output_file}
  input:
    domain:
      type: string
      required: true
    output_file:
      type: string
      default: "/tmp/findomain.txt"
  output:
    format: lines
    type: subdomains
  timeout: 600

capabilities:
  - subdomain_enum
  - cert_transparency
  - api_sources

resources:
  cpu: low
  memory: low
  network: moderate
