# APKeep — APK Downloader (EFF Threat Lab)
name: apkeep
category: mobile.acquisition
version: "latest"
description: Download APKs from Google Play, APKPure (no auth!), F-Droid, Huawei AppGallery

install:
  method: cargo
  command: cargo install apkeep
  verify: apkeep --help

execute:
  command: apkeep -a {package_id} {source_flag} {auth_flags} -o {output_dir}
  input:
    package_id:
      type: string
      required: true
      description: Android package name (e.g., com.instagram.android)
    source:
      type: string
      required: false
      default: "apkpure"
      description: "Download source: apkpure (no auth), google-play (needs creds), f-droid, huawei"
    output_dir:
      type: string
      default: "/tmp/app_downloads"
  output:
    format: file
    type: apk
  timeout: 300

capabilities:
  - apk_download
  - google_play_download
  - apkpure_download
  - fdroid_download

resources:
  cpu: low
  memory: low
  network: high
