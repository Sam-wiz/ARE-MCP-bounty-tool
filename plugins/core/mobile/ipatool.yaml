# ipatool — iOS IPA Downloader
name: ipatool
category: mobile.acquisition
version: "2.0"
description: Download iOS IPA files from the App Store (requires Apple ID)

install:
  method: brew
  command: brew install ipatool
  verify: ipatool --version

execute:
  command: ipatool download -b {bundle_id} -o {output_dir}
  input:
    bundle_id:
      type: string
      required: true
      description: iOS bundle ID (e.g., com.instagram.Instagram)
    output_dir:
      type: string
      default: "/tmp/app_downloads"
  output:
    format: file
    type: ipa
  timeout: 300

capabilities:
  - ipa_download
  - app_store_download

resources:
  cpu: low
  memory: low
  network: high
