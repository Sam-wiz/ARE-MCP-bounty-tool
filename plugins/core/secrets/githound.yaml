# GitHound - GitHub secret finder
name: githound
category: secrets.github
version: "1.4.0"
description: Reconnaissance tool for GitHub

install:
  method: go
  command: go install github.com/tillson/git-hound@latest
  verify: git-hound --help

execute:
  command: git-hound --subdomain-file {domains_file} --dig-files --dig-commits
  input:
    domains_file:
      type: string
      required: true
  output:
    format: text
    type: github_secrets
  timeout: 3600

capabilities:
  - github_search
  - secret_detection
  - subdomain_search

resources:
  cpu: low
  memory: low
  network: moderate
