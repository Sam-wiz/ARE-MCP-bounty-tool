# Gitrob - GitHub org scanner
name: gitrob
category: secrets.github
version: "2.0.0"
description: Reconnaissance tool for GitHub organizations

install:
  method: go
  command: go install github.com/michenriksen/gitrob@latest
  verify: gitrob --help

execute:
  command: gitrob analyze {org} --save {output_file}
  input:
    org:
      type: string
      required: true
    output_file:
      type: string
      default: "/tmp/gitrob.json"
  output:
    format: json
    type: github_findings
  timeout: 3600

capabilities:
  - org_scanning
  - secret_detection
  - file_analysis

resources:
  cpu: medium
  memory: medium
  network: high
