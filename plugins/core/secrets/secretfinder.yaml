# Secretfinder
name: secretfinder
category: secrets.js
version: "1.0.0"
description: Find secrets in JavaScript files

install:
  method: git
  command: git clone https://github.com/m4ll0k/SecretFinder.git && pip install -r requirements.txt
  verify: python3 SecretFinder.py -h

execute:
  command: python3 SecretFinder.py -i {url} -o cli
  input:
    url:
      type: string
      required: true
      description: URL to JS file or endpoint
  output:
    format: text
    type: secrets
  timeout: 300

capabilities:
  - js_secrets
  - api_keys
  - credentials

resources:
  cpu: low
  memory: low
  network: low
