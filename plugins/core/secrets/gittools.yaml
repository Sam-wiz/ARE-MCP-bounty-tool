# GitTools - Git repo scanner
name: gittools
category: secrets.git
version: "1.0.0"
description: Git repository tools

install:
  method: git
  command: git clone https://github.com/internetwache/GitTools.git
  verify: ls GitTools

execute:
  command: ./GitTools/Dumper/gitdumper.sh {url}/.git/ {output_dir}
  input:
    url:
      type: string
      required: true
    output_dir:
      type: string
      default: "/tmp/gittools"
  output:
    format: directory
    type: git_dump
  timeout: 1800

capabilities:
  - git_dumping
  - git_extraction

resources:
  cpu: low
  memory: low
  network: moderate
