# GitDorker - GitHub dorking
name: gitdorker
category: secrets.github
version: "1.0.0"
description: GitHub dorking tool

install:
  method: git
  command: git clone https://github.com/obheda12/GitDorker.git && pip install -r requirements.txt
  verify: python3 GitDorker.py -h

execute:
  command: python3 GitDorker.py -tf {token_file} -q {query} -d {dorks_file}
  input:
    token_file:
      type: string
      required: true
    query:
      type: string
      required: true
    dorks_file:
      type: string
      required: true
  output:
    format: text
    type: github_secrets
  timeout: 1800

capabilities:
  - github_dorking
  - secret_search
  - code_search

resources:
  cpu: low
  memory: low
  network: moderate
