# GitLeaks
name: gitleaks
category: secrets
version: "8.18.0"
description: Detect secrets in git repos

install:
  method: go
  command: go install github.com/gitleaks/gitleaks/v8@latest
  verify: gitleaks version

execute:
  command: gitleaks detect --source {path} --report-format json --report-path {output_file}
  input:
    path:
      type: string
      required: true
    output_file:
      type: string
      default: "/tmp/gitleaks.json"
  output:
    format: json
    type: secrets
  timeout: 1800

capabilities:
  - secret_detection
  - git_history
  - regex_patterns

resources:
  cpu: medium
  memory: medium
  network: none
